#Shell
shell           zsh
shell_integration enabled

#fonts
font_family      JetBrainsMono Nerd Font
font_size        14

# Window padding
window_padding_width  4

# Background opacity (0.0 to 1.0)
background_opacity    0.85

# Enable ligatures
enable_ligatures      yes

cursor_shape          block
url_style             curly

confirm_os_window_close  0
