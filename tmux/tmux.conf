# Enable Vi mode for copy mode
setw -g mode-keys vi

# Set prefix to backtick (`)
unbind C-b
set -g prefix `
bind ` send-prefix

# Enable mouse support
set -g mouse on

# Reload config with prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Set the status line update interval
set -g status-interval 1

# Enable 256-color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

bind c new-window -c "#{pane_current_path}"

# Start window and pane indexing from 1
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# window mode
setw -g mode-style "bg=default,fg=colour0"

# split sytle
set -g pane-border-style "bg=default,fg=colour0"
set -g pane-active-border-style "bg=default,fg=colour0"

# --- Status bar configuration ---
set-option -g status-position top
set-option -g status-style bg=default

set -g status-left "#[fg=white,bg=default] 👻 #[default]"

# Right Status line content: Displaying date and 12-hour time with AM/PM
set -g status-right "#[fg=white,bg=default] %A | %Y-%m-%d | 🕖 %I:%M %p #[default]"


setw -g window-status-format "#[fg=white,bg=default] #(tmux display-message -p '#I:#W' | tr '[:lower:]' '[:upper:]') #[default]"
setw -g window-status-current-format "#[fg=orange,bg=default] #(tmux display-message -p '#I:#W' | tr '[:lower:]' '[:upper:]') #[default]" 

# TPM (Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'

#Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jabirali/tmux-tilish'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux-tilish config
set -g @tilish-default 'main-vertical'
set -g @tilish-easymode 'on'

# Initialize TPM
run '~/.config/tmux/plugins/tpm/tpm'
